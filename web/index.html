<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ClassLab.io</title>
    <meta
      name="description"
      content="Peminjaman ruang kelas dan laboratorium kampus (Rumpun TI)."
    />
    <!-- Internal tool behind a login: no search indexing, no social previews. -->
    <meta name="robots" content="noindex" />

    <link
      rel="preload"
      href="/fonts/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Apply the saved theme before first paint. Keep in sync with context/theme-provider.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('classlab-theme')
        var dark =
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {}
    </script>

    <meta name="theme-color" content="#ededec" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
