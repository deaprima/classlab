openapi: 3.1.0
info:
  title: ClassLab.io API
  version: 1.0.0
  description: |
    Sistem Web Peminjaman Ruang Kelas dan Laboratorium Kampus (MVP Rumpun TI).

    **Peran**: MAHASISWA, ORGANISASI, TU, KALAB, OB, ADMIN.

    **Kewenangan per tipe ruang.** Tiap tipe ruang (KELAS, LAB, AUDITORIUM, RUANG_UJIAN, RUANG_SIDANG)
    punya kebijakan dengan `approver_roles` dan `requester_roles`. Awalnya: KELAS disetujui TU, LAB oleh KALAB,
    AUDITORIUM/RUANG_UJIAN/RUANG_SIDANG oleh TU dan ADMIN. Menyetujui, menolak, atau membatalkan booking sebagai
    pengelola, mengubah status laporan kerusakan, serta mengelola ruang dan jadwal membutuhkan peran yang menjadi
    approver tipe ruang tersebut. ADMIN dapat mengelola ruang dan jadwal semua tipe, tetapi hanya menyetujui tipe
    yang mencantumkan ADMIN. Pembacaan: peminta (MAHASISWA, ORGANISASI) hanya melihat booking miliknya; TU dan KALAB
    melihat booking dan laporan tipe ruang yang mereka setujui (di luar itu dijawab 404); ADMIN membaca semuanya;
    OB tidak dapat membaca booking dan hanya melihat laporan miliknya sendiri.

    **Password sementara.** Akun dengan `must_change_password: true` hanya dapat memakai `GET /auth/me`,
    `POST /auth/logout`, dan `POST /auth/change-password`. Semua endpoint terautentikasi lainnya dijawab
    403 dengan kode `PASSWORD_CHANGE_REQUIRED` (lihat respons `ForbiddenResponse`).

    Semua respons API membawa `Cache-Control: no-store`.
servers:
  - url: /api/v1
    description: Base API v1 endpoint
paths:
  /health:
    get:
      summary: Liveness & Database Health Check
      responses:
        '200':
          description: Service sehat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  database: { type: string, example: ok }
                  version: { type: string, example: 0.1.0 }
                  time: { type: string, format: date-time }

  /auth/login:
    post:
      summary: Login pengguna
      description: >
        Refresh token dikirim hanya lewat cookie `refresh_token` (httpOnly, SameSite=Strict, Path=/api/v1/auth),
        tidak pernah di body. Maksimal 5 percobaan per 15 menit per (identifier + IP). Bila `must_change_password`
        bernilai `true`, klien harus mengarahkan pengguna ke `POST /auth/change-password` sebelum memakai endpoint lain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: NIM atau NIP }
                password: { type: string }
      responses:
        '200':
          description: Login sukses (refresh token diset via cookie httpOnly)
          headers:
            Set-Cookie:
              description: Cookie `refresh_token`
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in, user, must_change_password]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, example: 900 }
                  user: { $ref: '#/components/schemas/User' }
                  must_change_password:
                    type: boolean
                    description: Sama dengan `user.must_change_password`; `true` bila akun masih memakai password sementara.
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429':
          description: Terlalu banyak percobaan login
          headers:
            Retry-After:
              description: Detik sampai percobaan berikutnya diizinkan
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /auth/refresh:
    post:
      summary: Rotasi refresh token dan dapatkan access token baru
      description: >
        Membaca cookie `refresh_token` dan menggantinya dengan yang baru. Memakai ulang token lama
        mencabut seluruh keluarga token (family_id) dan mengembalikan 401.
      responses:
        '200':
          description: Token berhasil diperbarui
          headers:
            Set-Cookie:
              description: Cookie `refresh_token` yang baru
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/logout:
    post:
      summary: Logout dan cabut refresh token
      description: Tetap dapat dipakai saat `must_change_password` bernilai `true`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil logout (body kosong, cookie dihapus)
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/me:
    get:
      summary: Dapatkan profil pengguna saat ini
      description: >
        Tetap dapat dipakai saat `must_change_password` bernilai `true`. Untuk MAHASISWA dan ORGANISASI,
        respons memuat `active_points` (poin pelanggaran aktif).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/change-password:
    post:
      summary: Ganti password sendiri
      description: >
        Mengganti password setelah memverifikasi password saat ini; `must_change_password` menjadi `false`.
        Seluruh sesi lain pengguna dicabut, sesi yang dipakai (refresh token pada cookie) tetap hidup.
        Password saat ini yang salah dijawab 422 pada field `current_password` (bukan 401). Tetap dapat dipakai
        saat `must_change_password` bernilai `true`. Percobaan dibatasi per pengguna; melebihi batas dijawab 429
        dengan `Retry-After`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password:
                  type: string
                  maxLength: 128
                  description: Panjang minimal sesuai konfigurasi (`MIN_PASSWORD_LENGTH`, default 10) dan harus berbeda dari password saat ini.
      responses:
        '204': { description: Password berhasil diganti (tanpa body) }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimitedResponse' }

  /users:
    get:
      summary: Daftar pengguna (ADMIN, TU)
      description: >
        ADMIN melihat semua akun. TU hanya melihat akun MAHASISWA: memfilter `role` selain MAHASISWA dijawab 403.
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: q
          in: query
          description: Cari pada nama, identifier, dan email (tanpa membedakan huruf besar/kecil)
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Buat pengguna baru (ADMIN)
      description: >
        Hanya ADMIN. Password yang diberikan bersifat sementara: akun dibuat dengan `must_change_password: true`.
        `pic_name` dan `pic_phone` wajib untuk role ORGANISASI dan ditolak (422) untuk role lain.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_unit_id, identifier, name, password, role]
              properties:
                org_unit_id: { type: string, format: uuid }
                identifier: { type: string }
                name: { type: string }
                email: { type: string, format: email, description: Opsional }
                password:
                  type: string
                  maxLength: 128
                  description: Password sementara; panjang minimal sesuai konfigurasi (`MIN_PASSWORD_LENGTH`, default 10).
                role: { $ref: '#/components/schemas/UserRole' }
                pic_name: { type: string, description: Nama penanggung jawab; wajib untuk ORGANISASI }
                pic_phone: { type: string, description: Telepon penanggung jawab; wajib untuk ORGANISASI }
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /users/{id}:
    patch:
      summary: Perbarui data/peran/status pengguna (ADMIN, TU)
      description: >
        Menonaktifkan pengguna mencabut semua sesi refresh miliknya. ADMIN tidak dapat menonaktifkan atau mengubah
        peran akunnya sendiri, dan harus tersisa minimal satu ADMIN aktif. TU hanya boleh mengubah akun MAHASISWA
        (selain itu 403) dan hanya field `name`, `email`, `is_active`; mengirim `role`, `pic_name`, `pic_phone`, atau
        `clear_booking_block` dijawab 403. Mengganti password dilakukan lewat `POST /users/{id}/reset-password`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/UserRole' }
                is_active: { type: boolean }
                pic_name: { type: string }
                pic_phone: { type: string }
                clear_booking_block:
                  type: boolean
                  description: "`true` menghapus blokir booking (`booking_blocked_until` menjadi null)"
      responses:
        '200':
          description: Pengguna diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /users/{id}/reset-password:
    post:
      summary: Reset password pengguna (ADMIN, TU)
      description: >
        Mengganti password akun dengan password sementara acak dan mengembalikannya satu kali; semua sesi refresh akun
        dicabut dan `must_change_password` menjadi `true`. TU hanya boleh untuk akun MAHASISWA (selain itu 403).
        Respons membawa `Cache-Control: no-store`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Password sementara baru (hanya tampil sekali)
          headers:
            Cache-Control:
              description: Selalu `no-store`
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password]
                properties:
                  temporary_password: { type: string }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /room-types:
    get:
      summary: Daftar tipe ruang beserta kebijakannya (semua peran terautentikasi)
      description: >
        Mengembalikan kebijakan tiap tipe ruang (BR-20): siapa approver dan peminta, kebijakan persetujuan,
        jam operasional bawaan, serta batas durasi dan hari ke depan. Dipakai klien untuk menentukan menu dan
        formulir; server tetap menjadi penentu pada setiap aksi. Respons tidak dipaginasi.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoomTypePolicy' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }

  /room-types/{type}:
    patch:
      summary: Ubah kebijakan tipe ruang (ADMIN)
      description: >
        Hanya ADMIN (peran lain 403). Semua field opsional, tetapi minimal satu field harus dikirim (body kosong
        dijawab 422). `approver_roles` dan `requester_roles` tidak boleh kosong dan tidak boleh memuat peran di luar
        himpunan yang diizinkan. Aturan lintas-field dinilai terhadap hasil akhir: jam buka harus sebelum jam
        tutup dan keduanya berkelipatan 30 menit (galat pada field `open_time`), durasi minimal tidak boleh
        melebihi durasi maksimal dan keduanya berkelipatan 30 menit (galat pada field `min_duration_min`).
        Perubahan berlaku mulai permintaan berikutnya; booking yang sudah dibuat tidak berubah keputusannya.
        Perubahan dicatat di audit log.
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: Tipe ruang (KELAS, LAB, AUDITORIUM, RUANG_UJIAN, RUANG_SIDANG); tipe yang tidak dikenal dijawab 404.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                approver_roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [TU, KALAB, ADMIN] }
                  description: Peran yang boleh menyetujui booking tipe ini; tidak boleh kosong.
                requester_roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [MAHASISWA, ORGANISASI] }
                  description: Peran yang boleh mengajukan booking tipe ini; tidak boleh kosong.
                approval_policy: { $ref: '#/components/schemas/ApprovalPolicy' }
                letter_required: { type: boolean }
                open_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam buka bawaan tipe (HH:MM, WIB)" }
                close_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam tutup bawaan tipe (HH:MM, WIB; `24:00` berarti tengah malam)" }
                min_duration_min: { type: integer, description: Durasi booking minimal dalam menit; kelipatan 30 }
                max_duration_min: { type: integer, description: Durasi booking maksimal dalam menit; kelipatan 30 }
                max_advance_days: { type: integer, minimum: 1, maximum: 365, description: Batas hari ke depan booking boleh diajukan }
      responses:
        '200':
          description: Kebijakan diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomTypePolicy' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /rooms:
    get:
      summary: Daftar ruang
      description: Ruang yang sudah dihapus (soft delete) tidak pernah muncul. Urut berdasarkan kode.
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RoomType' }
        - name: capacity_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: q
          in: query
          description: Cari pada kode dan nama (tanpa membedakan huruf besar/kecil)
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Room' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Tambah ruang baru (TU, KALAB, ADMIN)
      description: >
        Kode disimpan dalam huruf besar dan harus unik di antara ruang yang belum dihapus dalam satu unit.
        Peran harus TU, KALAB, atau ADMIN pada route, dan memegang kewenangan atas tipe ruang tersebut
        (approver tipe itu, atau ADMIN); selain itu 403. Jam operasional khusus ruang (`open_time` dan `close_time`,
        BR-29) opsional dan harus dikirim bersamaan; tanpa keduanya ruang mengikuti jam bawaan tipenya. Jam khusus
        harus berkelipatan 30 menit dan jam buka sebelum jam tutup; tidak dibatasi oleh jam bawaan tipe.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_unit_id, code, name, type, capacity]
              properties:
                org_unit_id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                type: { $ref: '#/components/schemas/RoomType' }
                capacity: { type: integer, minimum: 1 }
                facilities:
                  type: array
                  items: { type: string }
                open_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam buka khusus ruang (HH:MM, WIB); bersamaan dengan `close_time`" }
                close_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam tutup khusus ruang (HH:MM, WIB); bersamaan dengan `open_time`" }
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /rooms/{id}:
    get:
      summary: Detail ruang
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Ubah data ruang (TU, KALAB, ADMIN)
      description: >
        Kode ruang tidak dapat diubah. Mengirim `facilities` menggantikan seluruh daftar (`[]` mengosongkan).
        Pemanggil harus TU, KALAB, atau ADMIN dan memegang kewenangan atas tipe ruang (juga tipe tujuan bila `type`
        diubah); selain itu 403. Jam operasional khusus ruang (BR-29): `open_time` dan `close_time` dinilai terhadap
        hasil akhir, jadi cukup mengirim satu bila ruang sudah punya yang lain, tetapi keduanya harus terisi atau
        keduanya kosong. `clear_operating_hours: true` mengembalikan ruang ke jam bawaan tipenya dan tidak boleh
        dikirim bersama `open_time` atau `close_time` (422).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                type: { $ref: '#/components/schemas/RoomType' }
                capacity: { type: integer, minimum: 1 }
                facilities: { type: array, items: { type: string } }
                is_active: { type: boolean }
                open_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam buka khusus ruang (HH:MM, WIB)" }
                close_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam tutup khusus ruang (HH:MM, WIB)" }
                clear_operating_hours:
                  type: boolean
                  description: "`true` menghapus jam khusus ruang sehingga mengikuti jam bawaan tipe; tidak boleh dikombinasikan dengan `open_time`/`close_time`"
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Soft delete ruang (TU, KALAB, ADMIN)
      description: >
        Pemanggil harus TU, KALAB, atau ADMIN dan memegang kewenangan atas tipe ruang (selain itu 403). Ditolak dengan `ROOM_HAS_ACTIVE_BOOKINGS` bila masih ada booking MENUNGGU/DISETUJUI yang belum berakhir (BR-07).
        Jadwal dan riwayat booking tetap tersimpan.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Ruang berhasil dihapus }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /rooms/{id}/schedule:
    get:
      summary: Timeline gabungan jadwal akademik + booking disetujui (overlay)
      description: >
        Berisi jadwal (`SCHEDULE`) dan booking berstatus DISETUJUI atau BERLANGSUNG (`BOOKING`) yang beririsan dengan
        [from, to), urut waktu mulai. Booking MENUNGGU tidak ditampilkan. Rentang maksimal 31 hari.
        `operating_hours` memuat jam operasional efektif ruang (jam khusus ruang bila ada, jika tidak jam bawaan
        tipenya; BR-29) untuk menggambar grid kalender.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, operating_hours]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineItem' }
                  operating_hours: { $ref: '#/components/schemas/OperatingHours' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /schedules:
    post:
      summary: Buat jadwal manual / akademik, opsional berulang mingguan (TU, KALAB, ADMIN)
      description: >
        Pemanggil harus TU, KALAB, atau ADMIN dan memegang kewenangan atas tipe ruang jadwal (selain itu 403).
        Dengan `repeat`, dibuat satu sesi per minggu dari `start_at` sampai `repeat.until` (tanggal WIB, inklusif),
        maksimal 26 sesi. Semua atau tidak sama sekali: bila satu sesi bentrok, tidak ada yang dibuat dan
        `details` memuat seluruh bentrokan. Jadwal harus berada pada satu hari WIB. `source` default `MANUAL`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, title, start_at, end_at]
              properties:
                room_id: { type: string, format: uuid }
                title: { type: string }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                source: { $ref: '#/components/schemas/ScheduleSource' }
                repeat:
                  type: object
                  required: [freq, until]
                  properties:
                    freq: { type: string, enum: [WEEKLY] }
                    until: { type: string, format: date }
      responses:
        '201':
          description: Jadwal berhasil dibuat (satu elemen, atau satu per minggu bila berulang)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /schedules/{id}:
    patch:
      summary: Ubah jadwal (TU, KALAB, ADMIN)
      description: >
        Ruang tidak dapat dipindah. Pengecekan bentrok mengabaikan jadwal itu sendiri. Pemanggil harus TU, KALAB,
        atau ADMIN dan memegang kewenangan atas tipe ruang jadwal (selain itu 403).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
      responses:
        '200':
          description: Jadwal diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Hapus jadwal (TU, KALAB, ADMIN)
      description: Pemanggil harus TU, KALAB, atau ADMIN dan memegang kewenangan atas tipe ruang jadwal (selain itu 403).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Jadwal dihapus }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /availability:
    get:
      summary: Status ketersediaan per ruang pada rentang waktu
      description: >
        Hanya ruang aktif yang belum dihapus. Prioritas status: DIGUNAKAN (jadwal, atau booking DISETUJUI atau
        BERLANGSUNG) > DIAJUKAN (booking MENUNGGU) > TERSEDIA. Interval setengah-terbuka [start_at, end_at), jadi
        08:00-10:00 dan 10:00-12:00 tidak bentrok. Rentang maksimal 31 hari. Respons tidak dipaginasi.
        Tiap ruang membawa `operating_hours`, yaitu jam operasional efektifnya (BR-29).
      security:
        - BearerAuth: []
      parameters:
        - name: start_at
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end_at
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RoomType' }
        - name: capacity_min
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityRoom' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /bookings:
    get:
      summary: Daftar pengajuan booking (MAHASISWA, ORGANISASI, TU, KALAB, ADMIN)
      description: >
        MAHASISWA dan ORGANISASI hanya melihat booking miliknya. TU dan KALAB melihat booking tipe ruang yang
        mereka setujui; ADMIN melihat semua. `mine=true` mempersempit ke booking milik sendiri. OB dijawab 403.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter status booking.
          schema: { $ref: "#/components/schemas/BookingStatus" }
        - name: room_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: mine
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Ajukan booking baru (MAHASISWA, ORGANISASI)
      description: >-
        Satu pemohon maksimal memiliki `BOOKING_MAX_ACTIVE_PER_USER` (default 5) pengajuan aktif, yaitu
        `MENUNGGU` atau `DISETUJUI` yang belum berakhir. Melebihi batas dijawab 422 tanpa `field`.
        Peran selain MAHASISWA dan ORGANISASI dijawab 403 `FORBIDDEN`; bila `requester_roles` tipe ruang tidak
        memuat peran pemohon, dijawab 403 `ROOM_TYPE_NOT_ALLOWED`. Durasi minimal/maksimal dan batas hari ke depan
        berasal dari kebijakan tipe ruang (BR-20, lihat `GET /room-types`), bukan nilai global; pelanggarannya
        dijawab 422 `VALIDATION_ERROR` pada `end_at` (durasi) atau `start_at` (hari ke depan). Waktu di luar jam
        operasional efektif ruang (jam khusus ruang, atau jam bawaan tipe; BR-29) dijawab 422
        `OUTSIDE_OPERATING_HOURS` dengan `details` berisi dua item: `{field: open_time, message: "HH:MM"}` dan
        `{field: close_time, message: "HH:MM"}` yang membawa jendela efektif tersebut.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, start_at, end_at, purpose]
              properties:
                room_id: { type: string, format: uuid }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                purpose: { type: string }
                participants: { type: integer, minimum: 1 }
                notes: { type: string }
      responses:
        '201':
          description: >-
            Berhasil dibuat. Bila `Idempotency-Key` sama dengan permintaan identik sebelumnya, booking
            yang sudah ada dikembalikan dengan status yang sama dan header `Idempotency-Replayed: true`.
          headers:
            Idempotency-Replayed:
              description: '`true` bila respons ini adalah pengulangan dari permintaan sebelumnya'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}:
    get:
      summary: Detail pengajuan booking (MAHASISWA, ORGANISASI, TU, KALAB, ADMIN)
      description: >
        Pemohon hanya dapat membaca booking miliknya; TU dan KALAB hanya booking tipe ruang yang mereka setujui;
        ADMIN semuanya. Di luar jangkauan dijawab 404. OB dijawab 403.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/events:
    get:
      summary: Jejak riwayat audit status booking (MAHASISWA, ORGANISASI, TU, KALAB, ADMIN)
      description: >
        Aturan akses sama dengan detail booking. `actor_id` bernilai null bila perubahan dilakukan sistem
        (mis. job otomatis).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookingEvent' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/approve:
    post:
      summary: Setujui peminjaman ruang (TU, KALAB, ADMIN)
      description: >
        Pemanggil harus TU, KALAB, atau ADMIN yang menjadi approver tipe ruang booking (selain itu 403).
        Booking di luar jangkauan approver dijawab 404.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/reject:
    post:
      summary: Tolak peminjaman ruang (TU, KALAB, ADMIN)
      description: >
        Pemanggil harus TU, KALAB, atau ADMIN yang menjadi approver tipe ruang booking (selain itu 403).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/cancel:
    post:
      summary: Batalkan booking (pemilik, atau TU/KALAB/ADMIN approver tipe ruang)
      description: >
        Pemilik (MAHASISWA atau ORGANISASI) dapat membatalkan booking `MENUNGGU` miliknya; alasan opsional.
        Pengelola (TU, KALAB, ADMIN dengan kewenangan atas tipe ruang) membatalkan booking `DISETUJUI` dan wajib
        menyertakan `reason`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /notifications:
    get:
      summary: Daftar notifikasi pengguna
      security:
        - BearerAuth: []
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /notifications/{id}/read:
    post:
      summary: Tandai satu notifikasi sebagai telah dibaca (idempoten; `read_at` pertama dipertahankan)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notifikasi ditandai dibaca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /notifications/read-all:
    post:
      summary: Tandai seluruh notifikasi sebagai telah dibaca
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Semua notifikasi ditandai dibaca
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, description: Jumlah notifikasi yang berubah dari belum dibaca menjadi dibaca }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }

  /notifications/stream:
    get:
      summary: Server-Sent Events stream untuk pembaruan notifikasi
      description: >-
        Dibaca dengan `fetch` (EventSource tidak bisa mengirim header Authorization). Event:
        `ready` (`{"unread": N}`, dikirim sekali setelah stream aktif), `notification` (objek Notification;
        field `id:` berisi UUID-nya), `resync` (server kehilangan event; ambil ulang `GET /notifications`),
        dan `reconnect` (server menutup stream; buka stream baru). Baris komentar `: keep-alive` dikirim
        berkala. Stream ditutup sebelum access token yang dipakai membukanya kedaluwarsa. Event tidak
        diputar ulang: setelah (re)connect, ambil ulang daftar notifikasi.
        Satu pengguna maksimal membuka 5 stream sekaligus; yang ke-6 dijawab 429.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }

  /reports:
    get:
      summary: Daftar laporan kerusakan
      description: >
        Pelapor (peran apa pun, termasuk OB) melihat laporan miliknya. TU dan KALAB juga melihat laporan tipe ruang
        yang mereka setujui; ADMIN melihat semua.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - name: room_id
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DamageReport' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Buat laporan kerusakan baru (multipart/form-data)
      description: >-
        Foto opsional: JPG, PNG, atau WebP (dicek dari isi berkas, bukan nama atau Content-Type), maksimal
        `UPLOAD_MAX_BYTES` (default 5 MB). Foto terlalu besar atau bertipe lain dijawab 422 pada field `photo`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [room_id, description]
              properties:
                room_id: { type: string, format: uuid }
                description: { type: string }
                photo: { type: string, format: binary }
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DamageReport' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /reports/{id}:
    get:
      summary: Detail laporan kerusakan beserta riwayat event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/DamageReport' }
                  - type: object
                    required: [events]
                    properties:
                      events:
                        type: array
                        items: { $ref: '#/components/schemas/ReportEvent' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /reports/{id}/photo:
    get:
      summary: Foto laporan kerusakan (pelapor, TU/KALAB approver tipe ruang, ADMIN)
      description: Foto disimpan di luar webroot dan hanya disajikan lewat endpoint ini. Laporan di luar jangkauan dijawab 404.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berkas gambar
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /reports/{id}/status:
    patch:
      summary: Perbarui status laporan kerusakan (TU, KALAB, ADMIN)
      description: >
        Status hanya maju satu langkah (BARU, DITERIMA, DIPROSES, SELESAI); selain itu 409 `INVALID_STATE`.
        Pemanggil harus TU, KALAB, atau ADMIN yang menjadi approver tipe ruang laporan (selain itu 403).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ReportStatus' }
                note: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DamageReport' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /audit-logs:
    get:
      summary: Daftar audit log (ADMIN)
      description: >
        Hanya ADMIN (peran lain 403). Baca-saja, terbaru lebih dulu. Nilai `before` dan `after` sudah
        disamarkan dari rahasia (password, token).
      security:
        - BearerAuth: []
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: Nama aksi persis, mis. `USER_CREATED`
          schema: { type: string }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Batas bawah `created_at` (RFC 3339 dengan offset)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Batas atas `created_at` (RFC 3339 dengan offset)
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /imports:
    get:
      summary: Riwayat impor (TU, ADMIN)
      description: Daftar impor terbaru lebih dulu. Peran selain TU dan ADMIN dijawab 403.
      security:
        - BearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ImportKind' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Import' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /imports/users:
    post:
      summary: Impor akun mahasiswa dari CSV (TU, ADMIN; multipart/form-data)
      description: >
        Dua langkah. Dengan `?dry_run=true` berkas hanya diperiksa dan rencananya dikembalikan beserta `plan_hash`
        (tidak ada yang disimpan). Tanpa `dry_run`, impor diterapkan dalam satu transaksi dan wajib menyertakan
        `plan_hash` dari pratinjau untuk berkas dan semester yang sama; bila data berubah sejak pratinjau dijawab
        409 `IMPORT_PLAN_CHANGED`, dan berkas yang sama yang sudah pernah diterapkan dijawab 409
        `IMPORT_ALREADY_APPLIED`. CSV wajib berkolom `identifier` dan `name`; kolom opsional `email`,
        `course_code`, `course_name`, `class_name`. Berkas tidak valid dijawab 422 `IMPORT_INVALID` dengan `details`
        per baris (`line`, `column`); baris 1 adalah header. Respons penerapan memuat password sementara akun baru
        satu kali dan membawa `Cache-Control: no-store`.
      security:
        - BearerAuth: []
      parameters:
        - name: dry_run
          in: query
          description: "`true` untuk pratinjau tanpa menyimpan"
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, semester]
              properties:
                file: { type: string, format: binary, description: Berkas CSV }
                semester: { type: string, pattern: '^[0-9]{4}-(GANJIL|GENAP)$', example: 2026-GANJIL }
                plan_hash: { type: string, description: "Wajib saat menerapkan (tanpa `dry_run`); diambil dari respons pratinjau" }
      responses:
        '200':
          description: Pratinjau (`dry_run=true`) atau hasil penerapan
          headers:
            Cache-Control:
              description: "`no-store` pada hasil penerapan (memuat password sementara)"
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ImportUsersPreview' }
                  - { $ref: '#/components/schemas/ImportUsersResult' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '409':
          description: "`IMPORT_PLAN_CHANGED` atau `IMPORT_ALREADY_APPLIED`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '422':
          description: "`VALIDATION_ERROR` (mis. `semester`, `plan_hash`, `file`) atau `IMPORT_INVALID` (isi berkas bermasalah; `details` memuat `line` dan `column`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /imports/schedules:
    post:
      summary: Impor jadwal akademik semester dari CSV (TU, ADMIN; multipart/form-data)
      description: >
        Dua langkah (BR-23). Dengan `?dry_run=true` berkas hanya diperiksa dan rencananya dikembalikan beserta
        `plan_hash` (tidak ada yang disimpan). Tanpa `dry_run`, impor diterapkan dalam satu transaksi dan wajib
        menyertakan `plan_hash` dari pratinjau untuk berkas yang sama; bila data berubah sejak pratinjau dijawab 409
        `IMPORT_PLAN_CHANGED`, dan berkas yang sama yang sudah pernah diterapkan dijawab 409
        `IMPORT_ALREADY_APPLIED`.


        **Kolom CSV.** Wajib: `room_code`, `title`, `day_of_week` (1 = Senin sampai 7 = Minggu), `start_time` dan
        `end_time` (HH:MM, WIB, pada hari yang sama), `semester_start` dan `semester_end` (YYYY-MM-DD). Opsional:
        `skip_dates` (tanggal ISO dipisah spasi, dilewati). Tiap baris menjadi satu pertemuan per minggu pada hari
        tersebut dari `semester_start` sampai `semester_end`. Hanya pertemuan yang belum dimulai yang dibuat; yang
        sudah lewat tidak ditulis ulang. Jumlah pertemuan per baris dibatasi (`IMPORT_MAX_WEEKS`).


        **Aturan bentrok.** Jadwal akademik menang atas booking: booking MENUNGGU atau DISETUJUI yang bertabrakan
        dibatalkan otomatis (pemohon diberi notifikasi, tanpa poin pelanggaran) dan daftarnya muncul di
        `bookings_to_cancel`. Bentrok dengan booking yang sedang BERLANGSUNG, dengan jadwal akademik lain, dengan
        jadwal manual, atau dengan baris lain pada berkas yang sama menjadi galat per baris. Berkas yang memuat
        galat tidak dapat diterapkan: dijawab 422 `IMPORT_INVALID` dengan `details` per baris (`line`, `column`);
        baris 1 adalah header. Kode ruang dicari pada unit organisasi pengunggah.
      security:
        - BearerAuth: []
      parameters:
        - name: dry_run
          in: query
          description: "`true` untuk pratinjau tanpa menyimpan"
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Berkas CSV }
                plan_hash: { type: string, description: "Wajib saat menerapkan (tanpa `dry_run`); diambil dari respons pratinjau" }
      responses:
        '200':
          description: Pratinjau (`dry_run=true`) atau hasil penerapan
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/SchedulePreview' }
                  - { $ref: '#/components/schemas/ScheduleApplyResult' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '409':
          description: "`IMPORT_PLAN_CHANGED` atau `IMPORT_ALREADY_APPLIED`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '422':
          description: "`VALIDATION_ERROR` (mis. `plan_hash`, `file`) atau `IMPORT_INVALID` (isi berkas bermasalah; `details` memuat `line` dan `column`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /imports/{id}/rollback:
    post:
      summary: Rollback impor jadwal (TU, ADMIN)
      description: >
        Tanpa body. Menghapus pertemuan hasil impor jadwal yang belum dimulai dan menandai impor sebagai
        `ROLLED_BACK`; pertemuan yang sudah dimulai tetap ada sebagai riwayat. Booking yang dibatalkan oleh impor
        tidak dikembalikan. Untuk mengganti jadwal satu semester: rollback, lalu impor ulang (BR-23).
        Id tidak dikenal dijawab 404, impor yang sudah di-rollback dijawab 409 `INVALID_STATE`, dan impor
        selain jadwal (mis. akun) dijawab 422 pada field `id`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rollback berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RollbackResult' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageQuery:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1, maximum: 10000 }
    PerPageQuery:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    ErrorResponse:
      description: Respons error terstandar ClassLab
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    ForbiddenResponse:
      description: >-
        Akses ditolak (403). `error.code` adalah `FORBIDDEN` (peran atau kewenangan atas tipe ruang tidak cukup),
        `ROOM_TYPE_NOT_ALLOWED` (hanya `POST /bookings`: peran pemohon tidak termasuk `requester_roles` tipe ruang),
        atau `PASSWORD_CHANGE_REQUIRED` (akun masih memakai password sementara; berlaku untuk setiap endpoint
        terautentikasi kecuali `GET /auth/me`, `POST /auth/logout`, dan `POST /auth/change-password`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    RateLimitedResponse:
      description: Terlalu banyak percobaan (`RATE_LIMITED`)
      headers:
        Retry-After:
          description: Detik sampai percobaan berikutnya diizinkan
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorCode:
      type: string
      description: >-
        Kode error mesin-baca. 400 BAD_REQUEST; 401 UNAUTHENTICATED; 403 FORBIDDEN, PASSWORD_CHANGE_REQUIRED,
        ROOM_TYPE_NOT_ALLOWED; 404 NOT_FOUND; 405 METHOD_NOT_ALLOWED; 409 BOOKING_CONFLICT, INVALID_STATE,
        ROOM_INACTIVE, ROOM_HAS_ACTIVE_BOOKINGS, IMPORT_PLAN_CHANGED, IMPORT_ALREADY_APPLIED; 422 VALIDATION_ERROR,
        IMPORT_INVALID, OUTSIDE_OPERATING_HOURS (booking di luar jam operasional ruang; `details` berisi
        `open_time` dan `close_time` efektif); 429 RATE_LIMITED; 500 INTERNAL_SERVER_ERROR; 503 SERVICE_BUSY.
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - ROOM_TYPE_NOT_ALLOWED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - BOOKING_CONFLICT
        - INVALID_STATE
        - ROOM_INACTIVE
        - ROOM_HAS_ACTIVE_BOOKINGS
        - IMPORT_PLAN_CHANGED
        - IMPORT_ALREADY_APPLIED
        - VALIDATION_ERROR
        - IMPORT_INVALID
        - OUTSIDE_OPERATING_HOURS
        - RATE_LIMITED
        - INTERNAL_SERVER_ERROR
        - SERVICE_BUSY

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        kind: { type: string }
        status: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        line:
          type: integer
          description: Nomor baris pada berkas CSV yang diunggah (baris 1 adalah header). Hanya pada galat impor.
        column:
          type: string
          description: Nama kolom CSV yang bermasalah. Hanya pada galat impor.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, example: Ruang sudah terpakai pada rentang waktu tersebut. }
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
            request_id: { type: string, example: req_123456 }

    UserRole:
      type: string
      enum: [MAHASISWA, ORGANISASI, TU, KALAB, OB, ADMIN]

    RoomType:
      type: string
      enum: [KELAS, LAB, AUDITORIUM, RUANG_UJIAN, RUANG_SIDANG]

    BookingStatus:
      type: string
      enum: [MENUNGGU, DISETUJUI, DITOLAK, DIBATALKAN, BERLANGSUNG, SELESAI, TIDAK_HADIR, TANPA_CHECKOUT, KEDALUWARSA]

    ReportStatus:
      type: string
      enum: [BARU, DITERIMA, DIPROSES, SELESAI]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    User:
      type: object
      required: [id, org_unit_id, identifier, name, email, role, is_active, booking_blocked_until, pic_name, pic_phone, must_change_password, created_at]
      properties:
        id: { type: string, format: uuid }
        org_unit_id: { type: string, format: uuid }
        identifier: { type: string }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        is_active: { type: boolean }
        booking_blocked_until:
          type: [string, 'null']
          format: date-time
          description: Akun tidak dapat mengajukan booking sampai waktu ini; null bila tidak diblokir.
        pic_name:
          type: [string, 'null']
          description: Nama penanggung jawab; terisi untuk akun ORGANISASI.
        pic_phone:
          type: [string, 'null']
          description: Telepon penanggung jawab; terisi untuk akun ORGANISASI.
        must_change_password:
          type: boolean
          description: "`true` bila akun masih memakai password sementara dan harus menggantinya."
        active_points:
          type: integer
          description: Poin pelanggaran aktif. Hanya ada pada `GET /auth/me` untuk MAHASISWA dan ORGANISASI.
        created_at: { type: string, format: date-time }

    AuditLog:
      type: object
      required: [id, actor_id, actor_role, actor_identifier, actor_name, action, entity_type, entity_id, before, after, ip, user_agent, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, 'null'], format: uuid, description: Null bila dilakukan sistem }
        actor_role:
          oneOf:
            - { $ref: '#/components/schemas/UserRole' }
            - { type: 'null' }
        actor_identifier: { type: [string, 'null'] }
        actor_name: { type: [string, 'null'] }
        action: { type: string, example: USER_CREATED }
        entity_type: { type: string, example: USER }
        entity_id: { type: [string, 'null'], format: uuid }
        before:
          type: [object, array, string, number, boolean, 'null']
          description: Keadaan sebelum perubahan (JSON bebas, rahasia sudah disamarkan); null bila tidak ada.
        after:
          type: [object, array, string, number, boolean, 'null']
          description: Keadaan sesudah perubahan (JSON bebas, rahasia sudah disamarkan); null bila tidak ada.
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    ImportKind:
      type: string
      enum: [SCHEDULES, USERS]

    Import:
      type: object
      required: [id, kind, uploaded_by, file_name, semester, status, summary, created_at, rolled_back_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ImportKind' }
        uploaded_by:
          type: object
          required: [id, identifier, name]
          properties:
            id: { type: string, format: uuid }
            identifier: { type: string }
            name: { type: string }
        file_name: { type: [string, 'null'] }
        semester: { type: [string, 'null'], example: 2026-GANJIL }
        status: { type: string, enum: [COMMITTED, ROLLED_BACK] }
        summary:
          type: object
          additionalProperties: true
          description: Ringkasan hasil impor (isi bergantung pada `kind`).
        created_at: { type: string, format: date-time }
        rolled_back_at: { type: [string, 'null'], format: date-time }

    ImportRowError:
      type: object
      required: [line, message]
      properties:
        line: { type: integer, description: Nomor baris CSV (baris 1 adalah header) }
        column: { type: string }
        message: { type: string }

    ImportUsersPreview:
      type: object
      required: [rows, to_create, to_update, errors, plan_hash]
      properties:
        rows: { type: integer, description: Jumlah baris data pada berkas }
        to_create: { type: integer }
        to_update: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportRowError' }
        plan_hash: { type: string, description: Dikirim kembali saat menerapkan impor }

    ImportUsersResult:
      type: object
      required: [import_id, created, updated, credentials]
      properties:
        import_id: { type: string, format: uuid }
        created: { type: integer }
        updated: { type: integer }
        credentials:
          type: array
          description: Password sementara akun baru; hanya tampil pada respons ini.
          items:
            type: object
            required: [identifier, temporary_password]
            properties:
              identifier: { type: string }
              temporary_password: { type: string }

    SchedulePreview:
      type: object
      required: [rows, occurrences, errors, bookings_to_cancel, plan_hash]
      properties:
        rows: { type: integer, description: Jumlah baris data pada berkas }
        occurrences: { type: integer, description: Jumlah pertemuan yang akan dibuat (hanya yang belum dimulai) }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportRowError' }
        bookings_to_cancel:
          type: array
          description: Booking MENUNGGU/DISETUJUI yang akan dibatalkan karena kalah dari jadwal akademik.
          items:
            type: object
            required: [booking_id, room_code, start_at, end_at, conflicts_with]
            properties:
              booking_id: { type: string, format: uuid }
              room_code: { type: string }
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time }
              conflicts_with: { type: string, description: Judul jadwal akademik yang menggantikannya }
        plan_hash: { type: string, description: Dikirim kembali saat menerapkan impor }

    ScheduleApplyResult:
      type: object
      required: [import_id, rows, occurrences, bookings_cancelled]
      properties:
        import_id: { type: string, format: uuid, description: "Id impor; dipakai untuk `POST /imports/{id}/rollback`" }
        rows: { type: integer }
        occurrences: { type: integer, description: Jumlah pertemuan yang dibuat }
        bookings_cancelled: { type: integer, description: Jumlah booking yang dibatalkan oleh impor }

    RollbackResult:
      type: object
      required: [id, status, deleted_occurrences]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ROLLED_BACK] }
        deleted_occurrences: { type: integer, description: Jumlah pertemuan yang belum dimulai yang dihapus }

    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$'
      description: Jam dinding WIB berformat HH:MM. `24:00` hanya sah sebagai jam tutup (tengah malam).
      example: '07:00'

    ApprovalPolicy:
      type: string
      enum: [AUTO_IF_ELIGIBLE, ALWAYS_MANUAL]

    RoomTypePolicy:
      type: object
      required: [type, label, approver_roles, requester_roles, approval_policy, letter_required, open_time, close_time, min_duration_min, max_duration_min, max_advance_days, updated_at]
      properties:
        type: { $ref: '#/components/schemas/RoomType' }
        label: { type: string }
        approver_roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Peran yang boleh menyetujui booking dan mengelola ruang tipe ini.
        requester_roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Peran yang boleh mengajukan booking tipe ini.
        approval_policy: { $ref: '#/components/schemas/ApprovalPolicy' }
        letter_required: { type: boolean }
        open_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam buka bawaan tipe (HH:MM, WIB)" }
        close_time: { allOf: [{ $ref: '#/components/schemas/ClockTime' }], description: "Jam tutup bawaan tipe (HH:MM, WIB); bisa `24:00`" }
        min_duration_min: { type: integer, description: Durasi booking minimal (menit) }
        max_duration_min: { type: integer, description: Durasi booking maksimal (menit) }
        max_advance_days: { type: integer, description: Batas hari ke depan booking boleh diajukan }
        updated_at: { type: string, format: date-time }

    OperatingHours:
      type: object
      required: [open_time, close_time, custom]
      description: "Jam operasional efektif ruang (BR-29): jam khusus ruang bila ada, jika tidak jam bawaan tipenya."
      properties:
        open_time: { $ref: '#/components/schemas/ClockTime' }
        close_time: { $ref: '#/components/schemas/ClockTime' }
        custom: { type: boolean, description: "`true` bila ruang menetapkan jam sendiri" }

    Room:
      type: object
      required: [id, org_unit_id, code, name, type, capacity, facilities, is_active, open_time, close_time]
      properties:
        id: { type: string, format: uuid }
        org_unit_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/RoomType' }
        capacity: { type: integer }
        facilities: { type: array, items: { type: string } }
        is_active: { type: boolean }
        open_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$'
          description: Jam buka khusus ruang (HH:MM, WIB); null bila mengikuti jam bawaan tipe ruang (BR-29).
        close_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$'
          description: Jam tutup khusus ruang (HH:MM, WIB); null bila mengikuti jam bawaan tipe ruang (BR-29).

    ScheduleSource:
      type: string
      enum: [AKADEMIK, MANUAL]

    Schedule:
      type: object
      required: [id, room_id, title, start_at, end_at, source, created_by]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        title: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/ScheduleSource' }
        created_by: { type: string, format: uuid }

    TimelineItem:
      type: object
      required: [id, kind, title, start_at, end_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [SCHEDULE, BOOKING] }
        title: { type: string, description: 'Judul jadwal, atau tujuan (purpose) untuk booking' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }

    AvailabilityRoom:
      type: object
      required: [room, operating_hours, status, conflicts]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        operating_hours: { $ref: '#/components/schemas/OperatingHours' }
        status: { type: string, enum: [TERSEDIA, DIGUNAKAN, DIAJUKAN] }
        conflicts:
          type: array
          items:
            type: object
            required: [kind, title, start_at, end_at]
            properties:
              kind: { type: string, enum: [SCHEDULE, BOOKING] }
              title: { type: string }
              status: { type: string, enum: [MENUNGGU, DISETUJUI, BERLANGSUNG], description: 'Hanya untuk kind BOOKING' }
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time }

    BookingRequester:
      type: object
      required: [id, identifier, name]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, description: NIM atau NIP }
        name: { type: string }

    Booking:
      type: object
      required: [id, room_id, room, requester_id, requester, start_at, end_at, purpose, status, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        room: { $ref: '#/components/schemas/Room' }
        requester_id: { type: string, format: uuid }
        requester: { $ref: '#/components/schemas/BookingRequester' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        purpose: { type: string }
        participants: { type: integer }
        notes: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        decided_by: { type: string, format: uuid }
        decided_at: { type: string, format: date-time }
        decision_reason: { type: string }
        created_at: { type: string, format: date-time }

    BookingEvent:
      type: object
      required: [id, booking_id, actor_id, to_status, created_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        actor_id: { type: [string, 'null'], format: uuid, description: Null bila perubahan dilakukan sistem }
        from_status: { $ref: '#/components/schemas/BookingStatus' }
        to_status: { $ref: '#/components/schemas/BookingStatus' }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, type, title, body, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        ref_type: { type: string }
        ref_id: { type: string, format: uuid }
        read_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Reporter:
      type: object
      required: [id, identifier, name]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, description: NIM atau NIP }
        name: { type: string }

    DamageReport:
      type: object
      required: [id, room_id, room, reporter_id, reporter, description, status, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        room: { $ref: '#/components/schemas/Room' }
        reporter_id: { type: string, format: uuid }
        reporter: { $ref: '#/components/schemas/Reporter' }
        description: { type: string }
        photo_path:
          type: string
          description: >-
            Path URL foto (`/api/v1/reports/{id}/photo`), bukan lokasi berkas di server. Ada hanya bila
            laporan punya foto; ambil dengan header Authorization.
        status: { $ref: '#/components/schemas/ReportStatus' }
        handled_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ReportEvent:
      type: object
      required: [id, report_id, actor_id, to_status, created_at]
      properties:
        id: { type: string, format: uuid }
        report_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        from_status: { $ref: '#/components/schemas/ReportStatus' }
        to_status: { $ref: '#/components/schemas/ReportStatus' }
        note: { type: string }
        created_at: { type: string, format: date-time }
