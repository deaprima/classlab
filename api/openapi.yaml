openapi: 3.1.0
info:
  title: ClassLab.io API
  version: 1.0.0
  description: Sistem Web Peminjaman Ruang Kelas dan Laboratorium Kampus (MVP Rumpun TI).
servers:
  - url: /api/v1
    description: Base API v1 endpoint
paths:
  /health:
    get:
      summary: Liveness & Database Health Check
      responses:
        '200':
          description: Service sehat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  database: { type: string, example: ok }
                  version: { type: string, example: 0.1.0 }
                  time: { type: string, format: date-time }

  /auth/login:
    post:
      summary: Login pengguna
      description: >
        Refresh token dikirim hanya lewat cookie `refresh_token` (httpOnly, SameSite=Strict, Path=/api/v1/auth),
        tidak pernah di body. Maksimal 5 percobaan per 15 menit per (identifier + IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: NIM atau NIP }
                password: { type: string }
      responses:
        '200':
          description: Login sukses (refresh token diset via cookie httpOnly)
          headers:
            Set-Cookie:
              description: Cookie `refresh_token`
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in, user]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, example: 900 }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429':
          description: Terlalu banyak percobaan login
          headers:
            Retry-After:
              description: Detik sampai percobaan berikutnya diizinkan
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /auth/refresh:
    post:
      summary: Rotasi refresh token dan dapatkan access token baru
      description: >
        Membaca cookie `refresh_token` dan menggantinya dengan yang baru. Memakai ulang token lama
        mencabut seluruh keluarga token (family_id) dan mengembalikan 401.
      responses:
        '200':
          description: Token berhasil diperbarui
          headers:
            Set-Cookie:
              description: Cookie `refresh_token` yang baru
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/logout:
    post:
      summary: Logout dan cabut refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil logout (body kosong, cookie dihapus)
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/me:
    get:
      summary: Dapatkan profil pengguna saat ini
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /users:
    get:
      summary: Daftar pengguna (Kaprodi)
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: q
          in: query
          description: Cari pada nama, identifier, dan email (tanpa membedakan huruf besar/kecil)
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Buat pengguna baru (Kaprodi)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_unit_id, identifier, name, email, password, role]
              properties:
                org_unit_id: { type: string, format: uuid }
                identifier: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /users/{id}:
    patch:
      summary: Perbarui data/peran/status/password pengguna (Kaprodi)
      description: >
        Menonaktifkan pengguna atau mereset password mencabut semua sesi refresh miliknya.
        Kaprodi tidak dapat menonaktifkan atau mengubah peran akunnya sendiri.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/UserRole' }
                is_active: { type: boolean }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Pengguna diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /rooms:
    get:
      summary: Daftar ruang
      description: Ruang yang sudah dihapus (soft delete) tidak pernah muncul. Urut berdasarkan kode.
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RoomType' }
        - name: capacity_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: q
          in: query
          description: Cari pada kode dan nama (tanpa membedakan huruf besar/kecil)
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Room' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Tambah ruang baru (TU_KALAB, KAPRODI)
      description: Kode disimpan dalam huruf besar dan harus unik di antara ruang yang belum dihapus dalam satu unit.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_unit_id, code, name, type, capacity]
              properties:
                org_unit_id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                type: { $ref: '#/components/schemas/RoomType' }
                capacity: { type: integer, minimum: 1 }
                facilities:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /rooms/{id}:
    get:
      summary: Detail ruang
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      summary: Ubah data ruang (TU_KALAB, KAPRODI)
      description: Kode ruang tidak dapat diubah. Mengirim `facilities` menggantikan seluruh daftar (`[]` mengosongkan).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                type: { $ref: '#/components/schemas/RoomType' }
                capacity: { type: integer, minimum: 1 }
                facilities: { type: array, items: { type: string } }
                is_active: { type: boolean }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Soft delete ruang (TU_KALAB, KAPRODI)
      description: >
        Ditolak dengan `ROOM_HAS_ACTIVE_BOOKINGS` bila masih ada booking MENUNGGU/DISETUJUI yang belum berakhir (BR-07).
        Jadwal dan riwayat booking tetap tersimpan.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Ruang berhasil dihapus }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /rooms/{id}/schedule:
    get:
      summary: Timeline gabungan jadwal akademik + booking disetujui (overlay)
      description: >
        Berisi jadwal (`SCHEDULE`) dan booking berstatus DISETUJUI (`BOOKING`) yang beririsan dengan [from, to),
        urut waktu mulai. Booking MENUNGGU tidak ditampilkan. Rentang maksimal 31 hari.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineItem' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /schedules:
    post:
      summary: Buat jadwal manual / akademik, opsional berulang mingguan (TU_KALAB, KAPRODI)
      description: >
        Dengan `repeat`, dibuat satu sesi per minggu dari `start_at` sampai `repeat.until` (tanggal WIB, inklusif),
        maksimal 26 sesi. Semua atau tidak sama sekali: bila satu sesi bentrok, tidak ada yang dibuat dan
        `details` memuat seluruh bentrokan. Jadwal harus berada pada satu hari WIB. `source` default `MANUAL`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, title, start_at, end_at]
              properties:
                room_id: { type: string, format: uuid }
                title: { type: string }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                source: { $ref: '#/components/schemas/ScheduleSource' }
                repeat:
                  type: object
                  required: [freq, until]
                  properties:
                    freq: { type: string, enum: [WEEKLY] }
                    until: { type: string, format: date }
      responses:
        '201':
          description: Jadwal berhasil dibuat (satu elemen, atau satu per minggu bila berulang)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /schedules/{id}:
    patch:
      summary: Ubah jadwal (TU_KALAB, KAPRODI)
      description: Ruang tidak dapat dipindah. Pengecekan bentrok mengabaikan jadwal itu sendiri.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
      responses:
        '200':
          description: Jadwal diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      summary: Hapus jadwal (TU_KALAB, KAPRODI)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Jadwal dihapus }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /availability:
    get:
      summary: Status ketersediaan per ruang pada rentang waktu
      description: >
        Hanya ruang aktif yang belum dihapus. Prioritas status: DIGUNAKAN (jadwal atau booking DISETUJUI)
        > DIAJUKAN (booking MENUNGGU) > TERSEDIA. Interval setengah-terbuka [start_at, end_at), jadi
        08:00-10:00 dan 10:00-12:00 tidak bentrok. Rentang maksimal 31 hari. Respons tidak dipaginasi.
      security:
        - BearerAuth: []
      parameters:
        - name: start_at
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: end_at
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RoomType' }
        - name: capacity_min
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityRoom' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /bookings:
    get:
      summary: Daftar pengajuan booking
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: room_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: mine
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Ajukan booking baru (MAHASISWA)
      description: >-
        Satu mahasiswa maksimal memiliki `BOOKING_MAX_ACTIVE_PER_USER` (default 5) pengajuan aktif, yaitu
        `MENUNGGU` atau `DISETUJUI` yang belum berakhir. Melebihi batas dijawab 422 tanpa `field`.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, start_at, end_at, purpose]
              properties:
                room_id: { type: string, format: uuid }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time }
                purpose: { type: string }
                participants: { type: integer, minimum: 1 }
                notes: { type: string }
      responses:
        '201':
          description: >-
            Berhasil dibuat. Bila `Idempotency-Key` sama dengan permintaan identik sebelumnya, booking
            yang sudah ada dikembalikan dengan status yang sama dan header `Idempotency-Replayed: true`.
          headers:
            Idempotency-Replayed:
              description: '`true` bila respons ini adalah pengulangan dari permintaan sebelumnya'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}:
    get:
      summary: Detail pengajuan booking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/events:
    get:
      summary: Jejak riwayat audit status booking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookingEvent' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/approve:
    post:
      summary: Setujui peminjaman ruang (TU_KALAB)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/reject:
    post:
      summary: Tolak peminjaman ruang (TU_KALAB)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /bookings/{id}/cancel:
    post:
      summary: Batalkan booking (Pemilik atau TU_KALAB)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /notifications:
    get:
      summary: Daftar notifikasi pengguna
      security:
        - BearerAuth: []
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /notifications/{id}/read:
    post:
      summary: Tandai satu notifikasi sebagai telah dibaca (idempoten; `read_at` pertama dipertahankan)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notifikasi ditandai dibaca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /notifications/read-all:
    post:
      summary: Tandai seluruh notifikasi sebagai telah dibaca
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Semua notifikasi ditandai dibaca
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, description: Jumlah notifikasi yang berubah dari belum dibaca menjadi dibaca }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /notifications/stream:
    get:
      summary: Server-Sent Events stream untuk pembaruan notifikasi
      description: >-
        Dibaca dengan `fetch` (EventSource tidak bisa mengirim header Authorization). Event:
        `ready` (`{"unread": N}`, dikirim sekali setelah stream aktif), `notification` (objek Notification;
        field `id:` berisi UUID-nya), `resync` (server kehilangan event; ambil ulang `GET /notifications`),
        dan `reconnect` (server menutup stream; buka stream baru). Baris komentar `: keep-alive` dikirim
        berkala. Stream ditutup sebelum access token yang dipakai membukanya kedaluwarsa. Event tidak
        diputar ulang: setelah (re)connect, ambil ulang daftar notifikasi.
        Satu pengguna maksimal membuka 5 stream sekaligus; yang ke-6 dijawab 429.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }

  /reports:
    get:
      summary: Daftar laporan kerusakan
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - name: room_id
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PerPageQuery' }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DamageReport' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
    post:
      summary: Buat laporan kerusakan baru (multipart/form-data)
      description: >-
        Foto opsional: JPG, PNG, atau WebP (dicek dari isi berkas, bukan nama atau Content-Type), maksimal
        `UPLOAD_MAX_BYTES` (default 5 MB). Foto terlalu besar atau bertipe lain dijawab 422 pada field `photo`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [room_id, description]
              properties:
                room_id: { type: string, format: uuid }
                description: { type: string }
                photo: { type: string, format: binary }
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DamageReport' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

  /reports/{id}:
    get:
      summary: Detail laporan kerusakan beserta riwayat event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/DamageReport' }
                  - type: object
                    required: [events]
                    properties:
                      events:
                        type: array
                        items: { $ref: '#/components/schemas/ReportEvent' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /reports/{id}/photo:
    get:
      summary: Foto laporan kerusakan (pelapor, TU_KALAB, KAPRODI)
      description: Foto disimpan di luar webroot dan hanya disajikan lewat endpoint ini.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berkas gambar
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /reports/{id}/status:
    patch:
      summary: Perbarui status laporan kerusakan (TU_KALAB)
      description: Status hanya maju satu langkah (BARU, DITERIMA, DIPROSES, SELESAI); selain itu 409 `INVALID_STATE`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ReportStatus' }
                note: { type: string }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DamageReport' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageQuery:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1, maximum: 10000 }
    PerPageQuery:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    ErrorResponse:
      description: Respons error terstandar ClassLab
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: { type: string, example: BOOKING_CONFLICT }
            message: { type: string, example: Ruang sudah terpakai pada rentang waktu tersebut. }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
                  kind: { type: string }
                  status: { type: string }
                  start_at: { type: string, format: date-time }
                  end_at: { type: string, format: date-time }
            request_id: { type: string, example: req_123456 }

    UserRole:
      type: string
      enum: [MAHASISWA, TU_KALAB, OB, KAPRODI]

    RoomType:
      type: string
      enum: [KELAS, LAB]

    BookingStatus:
      type: string
      enum: [MENUNGGU, DISETUJUI, DITOLAK, DIBATALKAN]

    ReportStatus:
      type: string
      enum: [BARU, DITERIMA, DIPROSES, SELESAI]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    User:
      type: object
      required: [id, org_unit_id, identifier, name, email, role, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        org_unit_id: { type: string, format: uuid }
        identifier: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    Room:
      type: object
      required: [id, org_unit_id, code, name, type, capacity, facilities, is_active]
      properties:
        id: { type: string, format: uuid }
        org_unit_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/RoomType' }
        capacity: { type: integer }
        facilities: { type: array, items: { type: string } }
        is_active: { type: boolean }

    ScheduleSource:
      type: string
      enum: [AKADEMIK, MANUAL]

    Schedule:
      type: object
      required: [id, room_id, title, start_at, end_at, source, created_by]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        title: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/ScheduleSource' }
        created_by: { type: string, format: uuid }

    TimelineItem:
      type: object
      required: [id, kind, title, start_at, end_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [SCHEDULE, BOOKING] }
        title: { type: string, description: 'Judul jadwal, atau tujuan (purpose) untuk booking' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }

    AvailabilityRoom:
      type: object
      required: [room, status, conflicts]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        status: { type: string, enum: [TERSEDIA, DIGUNAKAN, DIAJUKAN] }
        conflicts:
          type: array
          items:
            type: object
            required: [kind, title, start_at, end_at]
            properties:
              kind: { type: string, enum: [SCHEDULE, BOOKING] }
              title: { type: string }
              status: { type: string, enum: [MENUNGGU, DISETUJUI], description: 'Hanya untuk kind BOOKING' }
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time }

    BookingRequester:
      type: object
      required: [id, identifier, name]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, description: NIM atau NIP }
        name: { type: string }

    Booking:
      type: object
      required: [id, room_id, room, requester_id, requester, start_at, end_at, purpose, status, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        room: { $ref: '#/components/schemas/Room' }
        requester_id: { type: string, format: uuid }
        requester: { $ref: '#/components/schemas/BookingRequester' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        purpose: { type: string }
        participants: { type: integer }
        notes: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        decided_by: { type: string, format: uuid }
        decided_at: { type: string, format: date-time }
        decision_reason: { type: string }
        created_at: { type: string, format: date-time }

    BookingEvent:
      type: object
      required: [id, booking_id, actor_id, to_status, created_at]
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        from_status: { $ref: '#/components/schemas/BookingStatus' }
        to_status: { $ref: '#/components/schemas/BookingStatus' }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, type, title, body, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        ref_type: { type: string }
        ref_id: { type: string, format: uuid }
        read_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Reporter:
      type: object
      required: [id, identifier, name]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, description: NIM atau NIP }
        name: { type: string }

    DamageReport:
      type: object
      required: [id, room_id, room, reporter_id, reporter, description, status, created_at]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        room: { $ref: '#/components/schemas/Room' }
        reporter_id: { type: string, format: uuid }
        reporter: { $ref: '#/components/schemas/Reporter' }
        description: { type: string }
        photo_path:
          type: string
          description: >-
            Path URL foto (`/api/v1/reports/{id}/photo`), bukan lokasi berkas di server. Ada hanya bila
            laporan punya foto; ambil dengan header Authorization.
        status: { $ref: '#/components/schemas/ReportStatus' }
        handled_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ReportEvent:
      type: object
      required: [id, report_id, actor_id, to_status, created_at]
      properties:
        id: { type: string, format: uuid }
        report_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        from_status: { $ref: '#/components/schemas/ReportStatus' }
        to_status: { $ref: '#/components/schemas/ReportStatus' }
        note: { type: string }
        created_at: { type: string, format: date-time }
