services:
  postgres:
    image: postgres:16-alpine
    container_name: classlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classlab
      POSTGRES_PASSWORD: classlab_secret
      POSTGRES_DB: classlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classlab -d classlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
